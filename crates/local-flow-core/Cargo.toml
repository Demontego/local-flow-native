[package]
name = "local-flow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared dictation engine: session FSM, whisper.cpp ASR, llama.cpp cleanup"

[features]
default = []
whisper = ["dep:whisper-rs"]
llama = ["dep:llama-cpp-2"]
vulkan = ["llama", "llama-cpp-2/vulkan"]
full = ["whisper", "llama"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
regex = "1"
ureq = { version = "3", features = ["rustls"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }
llama-cpp-2 = { version = "0.1.151", optional = true, features = ["metal"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
whisper-rs = { version = "0.16", optional = true }
llama-cpp-2 = { version = "0.1.151", optional = true }

[dev-dependencies]
tempfile = "3"
