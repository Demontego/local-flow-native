[package]
name = "local-flow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared dictation engine: session FSM, whisper.cpp ASR, llama.cpp cleanup"

[features]
default = []
whisper = ["dep:whisper-rs"]
llama = ["dep:llama-cpp-2"]
full = ["whisper", "llama"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
regex = "1"
ureq = { version = "3", features = ["rustls"] }

whisper-rs = { version = "0.14", optional = true, default-features = true }
llama-cpp-2 = { version = "0.1.151", optional = true, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
