[package]
name = "local-flow-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows tray shell for Local Flow Native"

[[bin]]
name = "local-flow-windows"
path = "src/main.rs"

[features]
default = []
# Whisper + Qwen (slow compile). Release / `make windows` enable this.
full = ["local-flow-core/full"]

[dependencies]
local-flow-core = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
parking_lot = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
winit = "0.30"
cpal = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
