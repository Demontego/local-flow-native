# On merge to main (and manual dispatch): build every shipping shell and upload
# artifacts. Tag builds still go through release.yml → GitHub Release.
name: Build all platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Short SHA label for artifact filenames on main merges.
  BUILD_LABEL: main-${{ github.sha }}

jobs:
  macos-dmg:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build DMG
        run: make dmg
      - name: Stage artifacts
        run: |
          mkdir -p dist/release
          for f in dist/*.dmg; do
            base=$(basename "$f" .dmg)
            cp "$f" "dist/release/${base}-${BUILD_LABEL}.dmg"
          done
          shasum -a 256 dist/release/*.dmg > dist/release/SHA256SUMS-macos.txt
          ls -la dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows tray (full)
        shell: bash
        run: make windows
      - name: Stage artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $exe = Get-ChildItem -Path target -Recurse -Filter local-flow-windows.exe |
            Where-Object { $_.FullName -match '[\\/]release[\\/]' } |
            Select-Object -First 1
          if (-not $exe) { throw "local-flow-windows.exe not found under target/*/release" }
          $label = $env:BUILD_LABEL
          $outName = "local-flow-$label-windows-x64.exe"
          $zipName = "local-flow-$label-windows-x64.zip"
          $out = Join-Path "dist/release" $outName
          $zip = Join-Path "dist/release" $zipName
          Copy-Item -Force $exe.FullName $out
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path $out -DestinationPath $zip
          $sum = Join-Path "dist/release" "SHA256SUMS-windows.txt"
          $lines = @()
          foreach ($f in @($out, $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f).Hash.ToLowerInvariant()
            $lines += "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Encoding ascii -Path $sum
          Get-ChildItem dist/release | Format-Table Name, Length
          Get-Content $sum
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build debug APK
        run: make android-debug
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: Stage artifacts
        run: |
          mkdir -p dist/release
          cp apps/local_flow_app/build/app/outputs/flutter-apk/app-debug.apk \
            "dist/release/local-flow-${BUILD_LABEL}-android-debug.apk"
          if [[ -d dist/android ]]; then cp -R dist/android/. dist/release/ || true; fi
          shasum -a 256 dist/release/*.apk > dist/release/SHA256SUMS-android.txt
          ls -la dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS simulator app (unsigned)
        run: make ios-simulator
      - name: Stage artifacts
        run: |
          mkdir -p dist/release
          APP=$(find apps/local_flow_app/build/ios -path '*/iphonesimulator/*.app' -type d | head -1)
          test -n "$APP" || { echo "no .app under build/ios"; find apps/local_flow_app/build/ios -maxdepth 4 2>/dev/null | head -50; exit 1; }
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/dist/release/local-flow-${BUILD_LABEL}-ios-simulator.app.zip" "$(basename "$APP")")
          shasum -a 256 dist/release/*.zip > dist/release/SHA256SUMS-ios.txt
          ls -la dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  all-green:
    needs: [macos-dmg, windows-exe, android-apk, ios-simulator]
    runs-on: ubuntu-latest
    steps:
      - name: All platform builds succeeded
        run: echo "macOS DMG, Windows exe, Android APK, iOS simulator — artifacts uploaded."
