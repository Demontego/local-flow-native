# Full mobile package builds need NDK / Xcode signing. Keep this opt-in until
# the runner images are wired (see docs/store/mobile-release.md).
name: Mobile package (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: make android-debug
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-flow-android-debug
          path: |
            apps/local_flow_app/build/app/outputs/flutter-apk/*.apk
            dist/android/

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: make ios-simulator
