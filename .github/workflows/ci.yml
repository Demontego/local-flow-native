name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Heuristic / core tests
        run: cargo test -p local-flow-core --test heuristic -- --skip qwen_cleanup
      - name: Windows crate smoke (host)
        run: cargo run -p local-flow-windows

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Swift type-check (fast)
        run: |
          swiftc -typecheck -parse-as-library \
            -import-objc-header apps/macos/Sources/LocalFlow/Bridging-Header.h \
            -I apps/macos/Sources/LocalFlow \
            apps/macos/Sources/LocalFlow/*.swift
      - name: Build macOS menubar app (FFI full + Swift link)
        run: make macos

  ios-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS app for the simulator (FFI full + Flutter, no signing)
        run: make ios-simulator

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: make flutter-analyze
